version: '3.8'

volumes:
    postgres-volume:
    redis-volume:

networks:
    db-lessons-net:
        name: "db-lessons-net"
        driver: bridge

services:
    db:
        image: postgres:17.0-alpine
        container_name: "db-lessons-database"
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-online_classes}
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
        networks:
            - db-lessons-net
        ports:
            - ${POSTGRES_PORT}:5432
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-online_classes}"]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped
        volumes:
            - postgres-volume:/var/lib/postgresql/data

    redis:
        image: redis:7-alpine
        container_name: "db-lessons-redis"
        networks:
            - db-lessons-net
        ports:
            - "${REDIS_PORT:-6379}:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
        restart: unless-stopped
        volumes:
            - redis-volume:/data
        command: redis-server --appendonly yes

    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: "db-lessons-app"
        env_file:
            - config.env
        environment:
            POSTGRES_HOST: db
            REDIS_HOST: redis
            POSTGRES_PORT: 5432
            REDIS_PORT: 6379
            SERVER_PORT_HTTP: ${SERVER_PORT_HTTP:-8080}
            MIGRATIONS_PATH: /root/migrations
        ports:
            - "${SERVER_PORT_HTTP:-8080}:${SERVER_PORT_HTTP:-8080}"
        networks:
            - db-lessons-net
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/ping"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

